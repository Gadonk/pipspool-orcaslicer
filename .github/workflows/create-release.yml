name: Create GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipspool*.whl"
      - "CHANGELOG.md"
      - ".github/scripts/check_release_payload.py"
      - ".github/workflows/create-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable wheel and upload size
        run: python3 .github/scripts/check_release_payload.py
      - name: Create or update unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/check_release_payload.py --version-only)"
          file="pipspool-${version}-py3-none-any.whl"
          tag="v${version}"
          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          test "$(wc -c < release-notes.md)" -le 4000
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$tag" "$file" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --draft --title "PipSpool $version" --notes-file release-notes.md
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" --draft \
              --title "PipSpool $version" --notes-file release-notes.md
          fi
