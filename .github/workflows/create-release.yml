name: Create GitHub Release

on:
  push:
    branches: [main]
    paths:
      - "pipspool_v*.py"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^pipspool_v.*_(win_x86_64|linux_x86_64|linux_arm64|macosx_x86_64|macosx_arm64)\.py$' \
            | sort)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "Expected five platform artifacts in the release commit, found ${#files[@]}" >&2
            exit 1
          fi

          file="${files[0]}"
          version="$(sed -n 's/^# version = "\([^"]*\)"/\1/p' "$file")"
          if [ -z "$version" ] || [[ "$version" == *-dev* ]]; then
            echo "Invalid stable version metadata: $version" >&2
            exit 1
          fi
          for artifact in "${files[@]}"; do
            grep -Fqx "# version = \"${version}\"" "$artifact"
          done
          tag="v${version}"

          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --draft --title "PipSpool $version" --notes-file release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --draft --title "PipSpool $version" --notes-file release-notes.md
          fi
