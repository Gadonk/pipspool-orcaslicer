name: Create GitHub Release

on:
  push:
    branches: [main]
    paths:
      - "pipspool_v*.py"
      - ".github/workflows/create-release.yml"

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(for artifact in pipspool_v*.py; do
            sed -n 's/^# version = "\([0-9][0-9.]*\)"/\1/p' "$artifact"
          done | sort -V | tail -n 1)"
          file_version="${version//./_}"
          files=(pipspool_v"${file_version}"_*.py)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "Expected five platform artifacts for ${version}, found ${#files[@]}" >&2
            exit 1
          fi

          file="${files[0]}"
          if [ -z "$version" ] || [[ "$version" == *-dev* ]]; then
            echo "Invalid stable version metadata: $version" >&2
            exit 1
          fi
          for artifact in "${files[@]}"; do
            grep -Fqx "# version = \"${version}\"" "$artifact"
          done
          tag="v${version}"

          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --draft=false --title "PipSpool $version" --notes-file release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "PipSpool $version" --notes-file release-notes.md
          fi

          gh workflow run publish-orcacloud.yml --ref main -f version="$version"
