name: Create GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipspool_v*.py"
      - ".github/workflows/create-release.yml"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(for artifact in pipspool_v*.py; do
            sed -n 's/^# version = "\([0-9][0-9.]*\)"/\1/p' "$artifact"
          done | sort -V | tail -n 1)"
          file_version="${version//./_}"
          files=(pipspool_v"${file_version}"_*.py)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "Expected five platform artifacts for ${version}, found ${#files[@]}" >&2
            exit 1
          fi

          file="${files[0]}"
          if [ -z "$version" ] || [[ "$version" == *-dev* ]]; then
            echo "Invalid stable version metadata: $version" >&2
            exit 1
          fi
          for artifact in "${files[@]}"; do
            grep -Fqx "# version = \"${version}\"" "$artifact"
          done
          tag="v${version}"

          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --draft=false --title "PipSpool $version" --notes-file release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "PipSpool $version" --notes-file release-notes.md
          fi

      - name: Validate Orca Cloud artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(for artifact in pipspool_v*.py; do
            sed -n 's/^# version = "\([0-9][0-9.]*\)"/\1/p' "$artifact"
          done | sort -V | tail -n 1)"
          file_version="${version//./_}"
          files=(pipspool_v"${file_version}"_*.py)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "Expected five platform files for ${version}, found ${#files[@]}" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            grep -Fqx "# version = \"${version}\"" "$file"
            grep -Fqx '# dependencies = ["requests"]' "$file"
            grep -Fqx 'DEFAULT_SPOOLMAN_URL = "http://localhost:7912"' "$file"
            if grep -Eq 'https?://(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)' "$file"; then
              echo "Private-network Spoolman address found in $file." >&2
              exit 1
            fi
            if grep -Fq -- '-dev' "$file"; then
              echo "Development marker found in $file." >&2
              exit 1
            fi
          done
          {
            echo "PIPSPOOL_VERSION=$version"
            echo 'PLUGIN_FILES<<EOF'
            printf '%s\n' "${files[@]}"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Publish release to OrcaCloud
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          changelog="$(head -c 4000 release-notes.md)"
          metadata="$(jq -cn --arg version "$PIPSPOOL_VERSION" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(--form-string "metadata=$metadata")
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          if [ "$status" = "201" ] || [ "$status" = "202" ]; then
            exit 0
          fi
          exit 1
