name: Validate PipSpool

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m py_compile pipspool_*.py

      - name: Enforce release-safe defaults on tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -R "192\.168\.0\.3" --include="*.py" .; then
            echo "Release blocked: private development Spoolman address found."
            exit 1
          fi
          grep -R 'DEFAULT_SPOOLMAN_URL = "http://localhost:7912"' --include="*.py" .
