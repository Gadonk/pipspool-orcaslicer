name: Materialize PipSpool issue 10 development build

on:
  push:
    branches:
      - feature/issue-10-lifecycle-events
    paths:
      - .github/workflows/materialize-issue-10.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-10-lifecycle-events

      - name: Build and validate development packages
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/issue10-source.patch.b64 > /tmp/pipspool-source.patch
          base64 -d .github/issue10-docs.patch.b64 > /tmp/pipspool-docs.patch
          cp pipspool_v2_2_9_win_x86_64.py pipspool.py
          git apply /tmp/pipspool-source.patch
          git apply /tmp/pipspool-docs.patch
          for platform in linux_arm64 linux_x86_64 macosx_arm64 macosx_x86_64 win_x86_64; do
            cp pipspool.py "pipspool_v2_2_10_dev_1_${platform}.py"
          done
          rm pipspool.py
          python3 -m py_compile pipspool_v2_2_10_dev_1_*.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path(".").glob("pipspool_v2_2_10_dev_1_*.py"))
          assert len(files) == 5
          payloads = [path.read_bytes() for path in files]
          assert len(set(payloads)) == 1
          text = payloads[0].decode()
          assert '# version = "2.2.10-dev_1"' in text
          assert 'PLUGIN_VERSION = "2.2.10-dev_1"' in text
          assert 'DEFAULT_SPOOLMAN_URL = "http://localhost:7912"' in text
          assert not re.search(
              r"https?://(?:10\\.|192\\.168\\.|172\\.(?:1[6-9]|2[0-9]|3[01])\\.)",
              text,
          )
          PY
          git diff --check
          find __pycache__ -type f -delete
          rmdir __pycache__
          git config user.name "Donko"
          git config user.email "75442485+Gadonk@users.noreply.github.com"
          git rm .github/issue10-source.patch.b64 .github/issue10-docs.patch.b64 .github/workflows/materialize-issue-10.yml
          git add CHANGELOG.md README.md pipspool_v2_2_10_dev_1_*.py
          git commit -m "Implement Orca lifecycle reconciliation [skip ci]"
          git push origin HEAD:feature/issue-10-lifecycle-events
