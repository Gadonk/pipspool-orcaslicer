name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          file_version="${version//./_}"
          files=(pipspool_v"${file_version}"*_win_x86_64.py)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one plugin file for ${version}, found ${#files[@]}: ${files[*]-}" >&2
            exit 1
          fi
          echo "PLUGIN_FILES=${files[0]}" >> "$GITHUB_ENV"
          expected_metadata="# version = \"${version}\""
          grep -Fqx "$expected_metadata" "${files[0]}"
          grep -Fqx '# dependencies = ["requests"]' "${files[0]}"
          grep -Fqx 'DEFAULT_SPOOLMAN_URL = "http://localhost:7912"' "${files[0]}"

          if grep -Eq 'https?://(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)' "${files[0]}"; then
            echo "Private-network Spoolman address found." >&2
            exit 1
          fi
          if grep -Fq -- '-dev' "${files[0]}"; then
            echo "Development marker found in stable release artifact." >&2
            exit 1
          fi

      - name: Publish release to OrcaCloud
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(--form-string "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
