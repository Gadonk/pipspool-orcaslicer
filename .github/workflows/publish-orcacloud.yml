name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # 2.2.4 was entered manually in Orca Cloud while a previous update was
    # awaiting review. Later releases continue to publish normally.
    if: github.event.release.tag_name != 'v2.2.4'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          file_version="${version//./_}"
          files=(pipspool_v"${file_version}"_*.py)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "Expected five platform files for ${version}, found ${#files[@]}: ${files[*]-}" >&2
            exit 1
          fi
          expected_metadata="# version = \"${version}\""
          for file in "${files[@]}"; do
            grep -Fqx "$expected_metadata" "$file"
            grep -Fqx '# dependencies = ["requests"]' "$file"
            grep -Fqx 'DEFAULT_SPOOLMAN_URL = "http://localhost:7912"' "$file"
            if grep -Eq 'https?://(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)' "$file"; then
              echo "Private-network Spoolman address found in $file." >&2
              exit 1
            fi
            if grep -Fq -- '-dev' "$file"; then
              echo "Development marker found in $file." >&2
              exit 1
            fi
          done
          {
            echo "PIPSPOOL_VERSION=$version"
            echo 'PLUGIN_FILES<<EOF'
            printf '%s\n' "${files[@]}"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Publish release to OrcaCloud
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$PIPSPOOL_VERSION" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(--form-string "metadata=$metadata")
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          if [ "$status" = "201" ] || [ "$status" = "202" ]; then
            exit 0
          fi
          exit 1
